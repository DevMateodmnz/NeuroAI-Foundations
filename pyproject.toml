[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroai-foundations"
version = "0.1.0"
description = "A small, transparent computational neuroscience learning laboratory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.1", "nbconvert>=7.16"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
